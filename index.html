<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سجل الجيم</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سجل الجيم">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2446F0">
<style>
/* Layout: single-column phone app, RTL. Big touch targets for sets (kg / reps / check).
   A fixed dock at the bottom holds the rest timer above the tab bar. */
:root{
  --bg:#E9ECF0; --surface:#F6F7F9; --surface-2:#DDE2E9; --ink:#141A24; --muted:#566173; --line:#C9D0D9;
  --accent:#2446F0; --accent-ink:#FFFFFF;
  --good:#167A4A; --on-good:#FFFFFF; --good-bg:#D3EDDF;
  --pr:#7A4700; --pr-bg:#F8E6BF; --bad:#B3261E; --scrim:rgba(14,18,25,.5);
  --f-display:-apple-system,'SF Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
  --f-body:-apple-system,'SF Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1118; --surface:#161C26; --surface-2:#212A37; --ink:#E8ECF2; --muted:#98A3B4; --line:#2B3544;
    --accent:#8EA2FF; --accent-ink:#0D1118;
    --good:#4CC38A; --on-good:#0D1118; --good-bg:#173A2A;
    --pr:#F2B84B; --pr-bg:#3A2C0C; --bad:#FF8A80; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#161C26; --surface-2:#212A37; --ink:#E8ECF2; --muted:#98A3B4; --line:#2B3544;
  --accent:#8EA2FF; --accent-ink:#0D1118;
  --good:#4CC38A; --on-good:#0D1118; --good-bg:#173A2A;
  --pr:#F2B84B; --pr-bg:#3A2C0C; --bad:#FF8A80; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.55 var(--f-body);
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto}
.muted{color:var(--muted)}
.sm{font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 0 16px}
.top>div{min-width:0}
.eyebrow{margin:0;font-size:13px;color:var(--muted)}
h1{margin:2px 0 0;font:800 32px/1.15 var(--f-display);text-wrap:balance}
.clockbox{text-align:left;flex:none}
.clockbox span{display:block;font-size:12px;color:var(--muted)}
#clock{font:700 24px var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent);direction:ltr}

main{padding-bottom:calc(var(--dockh,130px) + 28px)}
.stack{display:grid;gap:12px}
h2{margin:0;font:700 19px/1.3 var(--f-display);text-wrap:balance}
h3{margin:20px 0 10px;font:700 15px var(--f-body);color:var(--muted)}

/* buttons */
.btn{min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--surface-2);color:var(--ink);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}

/* today: start */
.lead{margin:0 0 14px;font-size:17px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:start;min-height:112px;padding:14px;border:0;border-radius:14px;background:var(--surface)}
.rcard b{font:800 26px/1.1 var(--f-display)}
.rcard span{font-size:13px;color:var(--muted)}
.rcard .go{margin-top:auto;color:var(--accent);font-weight:600;font-size:14px}
.card{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:10px}
.card p{margin:0}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* exercise */
.ex{background:var(--surface);border-radius:14px;padding:14px}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.prev{margin:2px 0 12px;font-size:13px;color:var(--muted)}
.cols,.set{display:grid;grid-template-columns:30px 1fr 1fr 54px;gap:8px;align-items:center}
.cols{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.set+.set,.set+.prrow,.prrow+.set{margin-top:8px}
.set .n{font:700 16px var(--f-display);color:var(--muted);text-align:center}
.set input{
  width:100%;min-width:0;height:54px;border:0;border-radius:8px;background:var(--surface-2);
  font:700 24px var(--f-display);text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield
}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set input::placeholder{color:var(--muted);opacity:.6}
.set.done input{background:var(--good-bg)}
.chk{width:54px;height:54px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center}
.chk svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.done .chk{background:var(--good);border-color:var(--good);color:var(--on-good)}
.prrow{margin-inline-start:38px;padding:4px 10px;border-radius:8px;background:var(--pr-bg);color:var(--pr);font-size:13px;font-weight:600;width:max-content;max-width:100%}
.ex-f{display:flex;gap:8px;margin-top:12px}
.ex-f .btn{flex:1}

/* history */
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum{background:var(--surface);border-radius:14px;padding:12px}
.sum b{display:block;font:800 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.prl{display:grid;gap:2px}
.pr-i{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;background:var(--surface)}
.pr-i:first-child{border-radius:14px 14px 0 0}
.pr-i:last-child{border-radius:0 0 14px 14px}
.pr-i:only-child{border-radius:14px}
.pr-i b{font-weight:600}
.pr-i .w{font:700 20px var(--f-display);text-align:left;font-variant-numeric:tabular-nums}
.pr-i small{color:var(--muted)}
.spark{grid-row:1/3;grid-column:2;justify-self:end}
.pr-i .w{grid-row:1;grid-column:2}
.spark svg{display:block}
.pr-i.hasspark{grid-template-columns:1fr 84px auto}
.pr-i.hasspark .spark{grid-row:1/3;grid-column:2}
.pr-i.hasspark .w{grid-column:3}
.sess{background:var(--surface);border-radius:14px;overflow:hidden}
.sess+.sess{margin-top:8px}
.sess-h{display:grid;gap:2px;width:100%;text-align:start;background:transparent;border:0;padding:14px}
.sess-d{font-size:13px;color:var(--muted)}
.sess-h strong{font:700 19px var(--f-display)}
.sess-b{padding:0 14px 14px;display:grid;gap:10px}
.sess-b div{display:grid;gap:2px}
.sess-b small{color:var(--muted)}
.empty{padding:22px 16px;border-radius:14px;background:var(--surface);color:var(--muted);text-align:center}

/* settings */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg .btn{padding:0;font-variant-numeric:tabular-nums}
.seg .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#bk{width:100%;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.dock-in{max-width:640px;margin:0 auto}
.rest{position:relative;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.rest-bar{position:absolute;top:0;left:0;right:0;height:4px;background:var(--surface-2)}
.rest-bar i{display:block;height:100%;background:var(--accent);transform-origin:right center;transition:transform .25s linear}
.rest-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rest-t{display:block;font:800 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.rest.over{background:var(--accent);color:var(--accent-ink)}
.rest.over .muted{color:inherit}
.rest.over .rest-bar{display:none}
.rest-btns{display:flex;gap:8px}
.rest-btns .btn{min-width:54px}
.rest.over .btn.pri{background:var(--accent-ink);color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 4px 10px;background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:600;min-height:58px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:640px;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel input[type=search],.panel input[type=text]{width:100%;min-width:0;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist{display:grid;gap:2px}
.pick{display:flex;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:0 12px;text-align:start;background:var(--bg);border:0;align-items:center}
.pick small{color:var(--muted)}
.plist .pick:first-child{border-radius:10px 10px 0 0}
.plist .pick:last-child{border-radius:0 0 10px 10px}
.plist .pick:only-child{border-radius:10px}
.custom{display:flex;gap:8px}
.custom input{flex:1}

.toast{position:fixed;left:50%;bottom:calc(var(--dockh,130px) + 14px);transform:translate(-50%,12px);z-index:40;max-width:min(92vw,520px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.rest-bar i{transition:none}}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="vt">النهارده</h1>
    </div>
    <div class="clockbox" id="clockbox" hidden><span>مدة التمرين</span><b id="clock">00:00</b></div>
  </header>
  <main id="view"></main>
</div>

<div class="dock" id="dock" dir="rtl">
  <div class="dock-in">
    <div class="rest" id="rest" hidden>
      <div class="rest-bar"><i id="restFill"></i></div>
      <div class="rest-row">
        <div><span class="muted sm" id="restLbl">راحة</span><strong class="rest-t" id="restT">1:30</strong></div>
        <div class="rest-btns">
          <button class="btn sm" data-act="rest-minus" dir="ltr" aria-label="قلل ١٥ ثانية">-15</button>
          <button class="btn sm" data-act="rest-plus" dir="ltr" aria-label="زوّد ١٥ ثانية">+15</button>
          <button class="btn sm pri" data-act="rest-skip">تخطي</button>
        </div>
      </div>
    </div>
    <nav class="tabs" aria-label="التنقل">
      <button class="tab" data-act="tab" data-v="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>النهارده</button>
      <button class="tab" data-act="tab" data-v="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>السجل</button>
      <button class="tab" data-act="tab" data-v="routines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>الروتين</button>
    </nav>
  </div>
</div>

<div class="sheet" id="sheet" dir="rtl" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" dir="rtl"></div>

<script>
(function(){
document.documentElement.dir='rtl';document.documentElement.lang='ar';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var LS={
  get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
var K_ACTIVE='gym.active.v1',K_CACHE='gym.cache.v1';

var LIB={
  'صدر':['بنش برس','انكلاين دمبل برس','تفتيح دمبل','كروس أوفر كابل','ديبس'],
  'ضهر':['سحب أمامي','تجديف بار','سحب كابل جالس','ديدلفت','عقلة'],
  'أرجل':['سكوات','ليج برس','رومانيان ديدلفت','ليج اكستنشن','ليج كيرل','سمانة واقف'],
  'كتف':['أوفر هيد برس','أرنولد برس','رفرفة جانبي','رفرفة خلفي'],
  'دراع':['باي بار','هامر كيرل','تراي كابل','فرنش برس'],
  'بطن':['كرنش كابل','رفع رجل']
};
var DEFAULT_ROUTINES=[
  {id:'r-push',name:'دفع',ex:['بنش برس','انكلاين دمبل برس','أوفر هيد برس','رفرفة جانبي','تراي كابل']},
  {id:'r-pull',name:'سحب',ex:['سحب أمامي','تجديف بار','سحب كابل جالس','رفرفة خلفي','باي بار']},
  {id:'r-legs',name:'أرجل',ex:['سكوات','ليج برس','رومانيان ديدلفت','ليج اكستنشن','ليج كيرل']}
];
var TX=['تمرين واحد','تمرينين','تمارين','تمرين'];
var SX=['مجموعة','مجموعتين','مجموعات','مجموعة'];
function pl(n,w){return n===1?w[0]:n===2?w[1]:n+' '+(n<=10?w[2]:w[3])}
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
var fmt=function(n){return String(Math.round(n*100)/100)};
var fmtDur=function(s){s=Math.max(0,s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=function(x){return String(x).padStart(2,'0')};return h?h+':'+p(m)+':'+p(c):p(m)+':'+p(c)};
var dLong=function(iso){return new Date(iso).toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})};
var dShort=function(iso){return new Date(iso).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short'})};
var setTxt=function(s){return '<span class="ltr">'+fmt(s.kg)+'×'+s.reps+'</span>'};

/* ---------- state ---------- */
var S={
  view:'today',
  profile:{routines:clone(DEFAULT_ROUTINES),custom:[],rest:90},
  sessions:[],
  active:LS.get(K_ACTIVE),
  sync:'local',openSession:null,sheet:null,confirm:null,dirty:false
};
(function(){var c=LS.get(K_CACHE);if(c){if(c.profile)S.profile=Object.assign(S.profile,c.profile);if(Array.isArray(c.sessions))S.sessions=c.sessions}})();
function cache(){LS.set(K_CACHE,{profile:S.profile,sessions:S.sessions.slice(0,200)})}
function saveActive(){if(S.active)LS.set(K_ACTIVE,S.active);else LS.del(K_ACTIVE)}

/* ---------- cloud (private per-user db), falls back to this device ---------- */
var profRef=null,sessCol=null,pTimer=null,failedOnce=false;
function dbFail(){if(!failedOnce){failedOnce=true;toast('مش قادر أحفظ على حسابك دلوقتي. بياناتك محفوظة على الموبايل.')}}
function saveProfile(){
  cache();
  if(!profRef)return;
  clearTimeout(pTimer);
  pTimer=setTimeout(function(){profRef.set(clone(S.profile)).catch(dbFail)},500);
}
async function initDb(){
  try{
    if(!(window.claude&&window.claude.use))return;
    var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    var db=res[0],user=res[1];
    if(!db||!user)return;
    var id=await user.id();
    if(!id)return;
    profRef=db.doc('data/users/'+id+'/profile');
    sessCol=profRef.collection('sessions');
    S.sync='wait';renderSync();
    var slow=setTimeout(function(){S.sync='slow';renderSync()},10000);
    profRef.onSnapshot(function(snap){
      if(snap.exists){S.profile=Object.assign({routines:clone(DEFAULT_ROUTINES),custom:[],rest:90},clone(snap.data()))}
      if(!snap.metadata.fromCache){clearTimeout(slow);S.sync='cloud'}
      cache();renderAll();
    },function(){clearTimeout(slow);S.sync='local';profRef=null;sessCol=null;renderSync()});
    sessCol.orderBy('date','desc').limit(300).onSnapshot(function(snap){
      S.sessions=snap.docs.map(function(d){return clone(d.data())});
      cache();renderAll();
    },function(){});
  }catch(e){}
}
function renderSync(){if(S.view==='routines')renderView()}

/* ---------- helpers on history ---------- */
function lastPerf(name){
  for(var i=0;i<S.sessions.length;i++){
    var e=S.sessions[i].exercises.find(function(x){return x.name===name});
    if(e&&e.sets.length)return {date:S.sessions[i].date,sets:e.sets};
  }
  return null;
}
function bestKg(name){
  var b=0;
  S.sessions.forEach(function(s){s.exercises.forEach(function(e){if(e.name===name)e.sets.forEach(function(t){b=Math.max(b,num(t.kg))})})});
  return b;
}
function volume(s){return s.exercises.reduce(function(a,e){return a+e.sets.reduce(function(b,t){return b+num(t.kg)*num(t.reps)},0)},0)}
function isPr(ex,st){
  var kg=num(st.kg);if(kg<=0)return false;
  var hist=bestKg(ex.name);if(hist<=0||kg<=hist)return false;
  return !ex.sets.some(function(o){return o!==st&&o.done&&num(o.kg)>=kg});
}

/* ---------- workout ---------- */
function makeEx(name){
  var lp=lastPerf(name);
  var sets=lp?lp.sets.map(function(s){return {kg:s.kg?String(s.kg):'',reps:s.reps?String(s.reps):'',done:false}})
             :[0,1,2].map(function(){return {kg:'',reps:'',done:false}});
  return {id:uid(),name:name,sets:sets};
}
function startWorkout(name,names){
  S.active={id:uid(),name:name,startedAt:Date.now(),exercises:names.map(makeEx)};
  saveActive();S.view='today';keepAwake();renderAll();window.scrollTo(0,0);
}
function finishWorkout(){
  var a=S.active;
  var exs=a.exercises.map(function(e){
    return {name:e.name,sets:e.sets.filter(function(s){return s.done&&num(s.reps)>0}).map(function(s){return {kg:num(s.kg),reps:num(s.reps)}})};
  }).filter(function(e){return e.sets.length});
  if(!exs.length){toast('علّم على مجموعة واحدة على الأقل');return}
  var prs=exs.filter(function(e){var h=bestKg(e.name);return h>0&&Math.max.apply(null,e.sets.map(function(s){return s.kg}))>h}).length;
  var session={id:uid(),date:new Date(a.startedAt).toISOString(),name:a.name,durationSec:Math.round((Date.now()-a.startedAt)/1000),exercises:exs};
  S.sessions.unshift(session);cache();
  if(sessCol)sessCol.doc(session.id).set(clone(session)).catch(dbFail);
  endActive();
  S.view='history';S.openSession=session.id;
  renderAll();window.scrollTo(0,0);
  toast('اتحفظ التمرين. حجم '+fmt(volume(session))+' كجم'+(prs?' و'+pl(prs,['رقم قياسي جديد','رقمين قياسيين','أرقام قياسية','رقم قياسي'])+'!':''));
}
function endActive(){
  S.active=null;saveActive();R.state='off';$('#rest').hidden=true;releaseWake();syncDock();
}
function deleteSession(id){
  S.sessions=S.sessions.filter(function(s){return s.id!==id});cache();
  if(sessCol)sessCol.doc(id).delete().catch(dbFail);
  renderView();
}
function confirmTwice(key,fn){
  if(S.confirm===key){S.confirm=null;fn();return}
  S.confirm=key;renderView();
  setTimeout(function(){if(S.confirm===key){S.confirm=null;renderView()}},3000);
}

/* ---------- rest timer, sound, wake lock ---------- */
var R={end:0,total:0,state:'off',doneAt:0};
var actx=null;
function unlockAudio(){
  try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!actx)actx=new A();if(actx.state==='suspended')actx.resume()}catch(e){}
}
function beep(){
  try{
    if(actx){
      [0,0.28].forEach(function(d){
        var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
        o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.22);
        o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.24);
      });
    }
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
function startRest(sec){
  R.total=sec;R.end=Date.now()+sec*1000;R.state='run';
  var r=$('#rest');r.hidden=false;r.classList.remove('over');syncDock();tick();
}
function tick(){
  var a=S.active;
  if(a)$('#clock').textContent=fmtDur(Math.floor((Date.now()-a.startedAt)/1000));
  if(R.state==='run'){
    var left=Math.ceil((R.end-Date.now())/1000);
    if(left<=0){
      R.state='over';R.doneAt=Date.now();beep();
      $('#restLbl').textContent='خلصت الراحة';$('#restT').textContent='يلا كمّل';
      $('#rest').classList.add('over');
    }else{
      $('#restLbl').textContent='راحة';$('#restT').textContent=fmtDur(left);
      $('#restFill').style.transform='scaleX('+Math.max(0,(R.end-Date.now())/(R.total*1000))+')';
    }
  }else if(R.state==='over'&&Date.now()-R.doneAt>6000){
    R.state='off';$('#rest').hidden=true;syncDock();
  }
}
setInterval(tick,250);
var wl=null;
async function keepAwake(){
  try{
    if(S.active&&navigator.wakeLock&&document.visibilityState==='visible'&&!wl){
      wl=await navigator.wakeLock.request('screen');
      wl.addEventListener('release',function(){wl=null});
    }
  }catch(e){wl=null}
}
function releaseWake(){try{if(wl){wl.release();wl=null}}catch(e){wl=null}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){keepAwake();tick()}});

function spark(series){
  var d=series.slice(-10);if(d.length<2)return '';
  var mn=Math.min.apply(null,d),mx=Math.max.apply(null,d),rg=mx-mn||1;
  var pts=d.map(function(v,i){return (4+i*(76/(d.length-1))).toFixed(1)+','+(24-((v-mn)/rg)*20).toFixed(1)}).join(' ');
  var lp=pts.split(' ').pop().split(',');
  return '<span class="spark"><svg width="84" height="28" viewBox="0 0 84 28" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="3.5" fill="var(--accent)"/></svg></span>';
}
function prTable(){
  var m=new Map();
  S.sessions.slice().reverse().forEach(function(s){
    s.exercises.forEach(function(e){
      var top=0,reps=0;
      e.sets.forEach(function(t){if(t.kg>top||(t.kg===top&&t.reps>reps)){top=t.kg;reps=t.reps}});
      var r=m.get(e.name);
      if(!r){r={name:e.name,best:0,reps:0,date:s.date,series:[],last:s.date};m.set(e.name,r)}
      r.series.push(top);r.last=s.date;
      if(top>r.best||(top===r.best&&reps>r.reps)){r.best=top;r.reps=reps;r.date=s.date}
    });
  });
  return Array.from(m.values()).sort(function(a,b){return b.last.localeCompare(a.last)});
}

  var vol=wk.reduce(function(a,s){return a+volume(s)},0),mins=wk.reduce(function(a,s){return a+s.durationSec},0)/60;

/* ---------- sheet ---------- */
function allExercises(){
  var out=[];
  Object.keys(LIB).forEach(function(g){LIB[g].forEach(function(n){out.push({n:n,g:g})})});
  (S.profile.custom||[]).forEach(function(n){out.push({n:n,g:'تمارينك'})});

function renderSheet(){
  var sh=$('#sheet'),sp=S.sheet;

  sh.hidden=false;

      +'<input id="sq" type="search" placeholder="دوّر على تمرين" aria-label="دوّر على تمرين" value="'+esc(sp.q)+'">'
      +'<div class="chips">'+groups.map(function(g){return '<button class="chip" data-act="chip" data-g="'+esc(g)+'" aria-pressed="'+(sp.group===g)+'">'+esc(g)+'</button>'}).join('')+'</div>'
      +'<div class="plist" id="plist"></div>'
      +'<form class="custom" id="customForm"><input id="cname" type="text" placeholder="تمرين تاني؟ اكتب اسمه" aria-label="اسم تمرين جديد"><button class="btn pri" type="submit">ضيف</button></form></div>';
    fillList();
  }else{
    sh.innerHTML='<div class="scrim" data-act="close-sheet"></div><div class="panel" role="dialog" aria-modal="true" aria-label="احفظ كروتين">'
      +'<div class="panel-h"><h2>احفظ كروتين</h2><button class="btn ghost sm" data-act="close-sheet">قفل</button></div>'
      +'<p class="muted" style="margin:0">هيتحفظ بالتمارين اللي في التمرين الحالي.</p>'
      +'<form class="custom" id="saveForm"><input id="rname" type="text" value="'+esc(S.active?S.active.name:'')+'" aria-label="اسم الروتين"><button class="btn pri" type="submit">احفظ</button></form></div>';

function fillList(){
  var sp=S.sheet,q=(sp.q||'').trim();

function addToWorkout(name){
  if(!S.active)return;
  S.active.exercises.push(makeEx(name));saveActive();

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  unlockAudio();
  var act=b.dataset.act,A=S.active;
  var exEl=b.closest('.ex'),ei=exEl?+exEl.dataset.e:-1;
  var setEl=b.closest('.set'),si=setEl?+setEl.dataset.s:-1;
  switch(act){
    case 'tab':S.view=b.dataset.v;S.confirm=null;renderAll();window.scrollTo(0,0);break;
    case 'start':{var r=S.profile.routines.find(function(x){return x.id===b.dataset.r});if(r&&!S.active)startWorkout(r.name,r.ex);break}
    case 'start-empty':startWorkout('تمرين حر',[]);if(S.active)S.sheet={type:'add',q:'',group:'الكل'},renderSheet();break;
    case 'tog':{
      var ex=A.exercises[ei],st=ex.sets[si];
      if(!st.done){
        if(num(st.reps)<=0){var f=document.getElementById('rp_'+ex.id+'_'+si);if(f)f.focus();toast('اكتب عدد العدّات الأول');break}
        st.done=true;st.pr=isPr(ex,st);startRest(S.profile.rest||90);
      }else{st.done=false;st.pr=false}
      saveActive();renderView();break;
    }
    case 'add-set':{var ex2=A.exercises[ei],l=ex2.sets[ex2.sets.length-1]||{kg:'',reps:''};ex2.sets.push({kg:l.kg,reps:l.reps,done:false});saveActive();renderView();break}
    case 'del-set':{var ex3=A.exercises[ei];if(ex3.sets.length>1){ex3.sets.pop();saveActive();renderView()}break}
    case 'rm-ex':A.exercises.splice(ei,1);saveActive();renderView();break;
    case 'finish':finishWorkout();break;
    case 'cancel':confirmTwice('cancel',function(){endActive();renderAll()});break;
    case 'open-s':S.openSession=S.openSession===b.dataset.id?null:b.dataset.id;renderView();break;
    case 'del-s':confirmTwice('s'+b.dataset.id,function(){deleteSession(b.dataset.id)});break;
    case 'del-r':confirmTwice('r'+b.dataset.r,function(){S.profile.routines=S.profile.routines.filter(function(x){return x.id!==b.dataset.r});saveProfile();renderView()});break;
    case 'rest-set':S.profile.rest=+b.dataset.v;saveProfile();renderView();break;
    case 'rest-minus':if(R.state==='run'){R.end-=15000;tick()}break;
    case 'rest-plus':if(R.state==='run'){R.end+=15000;R.total+=15;tick()}break;
    case 'rest-skip':R.state='off';$('#rest').hidden=true;syncDock();break;
    case 'sheet-add':S.sheet={type:'add',q:'',group:'الكل'};renderSheet();break;
    case 'sheet-save':S.sheet={type:'save'};renderSheet();break;
    case 'close-sheet':S.sheet=null;renderSheet();break;
    case 'chip':S.sheet.group=b.dataset.g;renderSheet();break;
    case 'backup-make':{
      var txt=JSON.stringify({v:1,profile:S.profile,sessions:S.sessions});
      var ta=document.getElementById('bk');ta.value=txt;ta.focus();ta.select();
      var done=false;
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('اتنسخت. الصقها في مكان آمن')},function(){toast('اضغط مطوّلاً على النص وانسخه')});done=true}}catch(e){}
      if(!done)toast('اضغط مطوّلاً على النص وانسخه');
      break;
    }
    case 'backup-restore':{
      try{
        var d=JSON.parse(document.getElementById('bk').value);
        if(!d||!Array.isArray(d.sessions)||!d.profile||!Array.isArray(d.profile.routines))throw 0;
        S.profile=Object.assign({routines:clone(DEFAULT_ROUTINES),custom:[],rest:90},d.profile);S.sessions=d.sessions;
        cache();renderView();toast('اتسترجع '+pl(d.sessions.length,TX));
      }catch(e){toast('النص مش نسخة صحيحة. الصق النسخة كاملة')}
      break;
    }
    case 'pick':{var it=S.sheet.list[+b.dataset.i];if(it)addToWorkout(it.n);break}
  }
});
$('#view').addEventListener('input',function(ev){
  var t=ev.target;if(!t.dataset||!t.dataset.f||!S.active)return;
  var ex=S.active.exercises[+t.closest('.ex').dataset.e];
  ex.sets[+t.closest('.set').dataset.s][t.dataset.f]=t.value;saveActive();
});
$('#sheet').addEventListener('input',function(ev){
  if(ev.target.id==='sq'&&S.sheet){S.sheet.q=ev.target.value;fillList()}
});
$('#sheet').addEventListener('submit',function(ev){
  ev.preventDefault();
  if(ev.target.id==='customForm'){
    var n=$('#cname').value.trim();if(!n)return;
    if(!allExercises().some(function(x){return x.n===n})){S.profile.custom=(S.profile.custom||[]).concat(n);saveProfile()}
    addToWorkout(n);
  }else if(ev.target.id==='saveForm'&&S.active){
    var nm=$('#rname').value.trim()||S.active.name;
    S.profile.routines.push({id:uid(),name:nm,ex:S.active.exercises.map(function(e){return e.name})});
    saveProfile();S.sheet=null;renderSheet();toast('اتحفظ الروتين «'+nm+'»');
  }
});
document.addEventListener('focusout',function(){
  if(!S.dirty)return;
  setTimeout(function(){var ae=document.activeElement;if(!(ae&&ae.tagName==='INPUT'&&ae.closest('#view'))){S.dirty=false;renderAll()}},80);
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});

/* ---------- boot ---------- */
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js')}catch(e){}
if(S.active){keepAwake()}
renderAll();
})();
</script>
</body>
</html>
